# A production-shaped local cluster: 1 control-plane + 2 workers.
# We use multiple worker nodes on purpose so that scheduling, pod spread,
# disruption budgets, and node-drain behavior are real from day one — a
# single-node cluster hides exactly the things that matter in production.
#
# Create with:
#   kind create cluster --name k8s-training --config modules/00-setup/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
